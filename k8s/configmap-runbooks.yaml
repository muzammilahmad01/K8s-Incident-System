apiVersion: v1
data:
  crashloop.md: |
    # Runbook: CrashLoopBackOff

    ## Symptom
    A pod repeatedly starts, crashes, and is restarted by Kubernetes. `kubectl get pod`
    shows status `CrashLoopBackOff` and a rising `RESTARTS` count.

    ## Common Causes
    - Application exits non-zero on startup (bad config, missing env var, failed migration).
    - Misconfigured liveness probe killing a healthy-but-slow container.
    - Missing dependency or unreachable downstream service at boot.
    - Image entrypoint that runs once and exits (e.g. a script with no long-running process).

    ## Investigation Steps
    1. `kubectl describe pod <name>` — read the Events for the exit reason.
    2. `kubectl logs <name> --previous` — inspect the crashed container's last output.
    3. Check the container's exit code: code 1 = app error, 137 = OOMKilled/SIGKILL, 143 = SIGTERM.
    4. Verify required ConfigMaps/Secrets/env vars exist and are mounted.

    ## Remediation
    - **Transient / single test pod (LOW severity):** delete the pod to force a clean
      restart (`restart_pod`). Safe to automate.
    - **Bad config or image:** roll back the deployment to the last good revision —
      requires human approval (MEDIUM/HIGH).
    - **Liveness probe too aggressive:** increase `initialDelaySeconds` / `timeoutSeconds`.

    ## Notes
    A crashing pod that recovers after a restart is LOW severity. A crash that recurs
    immediately after restart, or affects a production workload, is MEDIUM or higher.
  node-pressure.md: |
    # Runbook: Node Pressure (Memory / Disk / PID)

    ## Symptom
    A node reports a pressure condition. `kubectl get nodes` shows a condition such as
    `MemoryPressure=True`, `DiskPressure=True`, or `PIDPressure=True`. The kubelet may
    begin evicting pods.

    ## Common Causes
    - Node oversubscribed: sum of pod requests/usage exceeds capacity.
    - Disk filling from logs, images, or ephemeral storage.
    - A runaway pod consuming memory or spawning processes.

    ## Investigation Steps
    1. `get_node_conditions` — identify which node and which pressure type.
    2. `query_prometheus` — `node_memory_MemAvailable_bytes`, `node_filesystem_avail_bytes`.
    3. Identify the heaviest pods on the node (`kubectl top pods` if metrics-server present).
    4. Check for evicted pods (`kubectl get pods --field-selector status.phase=Failed`).

    ## Remediation
    - **Disk pressure from images/logs:** prune unused images, rotate logs —
      human approval (MEDIUM).
    - **Memory pressure from one workload:** `scale_deployment` down the offender or
      reschedule — approval required if MEDIUM/HIGH.
    - **Chronic oversubscription:** add a node / raise capacity — HIGH, human only.

    ## Notes
    Node-level pressure is almost never LOW: it can cascade into multi-pod evictions.
    Treat as MEDIUM minimum and require human approval before any action.
  oomkilled.md: |
    # Runbook: OOMKilled

    ## Symptom
    A container is killed by the kernel out-of-memory killer. `kubectl describe pod`
    shows `Reason: OOMKilled` and the container exit code is `137`.

    ## Common Causes
    - Container memory limit set too low for the actual workload.
    - Memory leak in the application.
    - A sudden traffic spike increasing per-request memory.
    - Large in-memory caches or unbounded buffers.

    ## Investigation Steps
    1. `kubectl describe pod <name>` — confirm `OOMKilled` and which container.
    2. `kubectl logs <name> --previous` — look for the last activity before the kill.
    3. Compare the container `resources.limits.memory` against observed usage
       (`query_prometheus` with `container_memory_working_set_bytes`).
    4. Check whether usage grows monotonically (leak) or spikes (load).

    ## Remediation
    - **Limit slightly too low, stable workload:** raise `resources.limits.memory`
      in the deployment — requires human approval (MEDIUM).
    - **Memory leak:** roll back to the previous image and file a bug — HIGH severity.
    - **Replica pressure under load:** `scale_deployment` to add replicas and spread
      memory — safe to automate only if classified LOW.

    ## Notes
    OOMKilled is rarely LOW because it implies a resourcing or code problem that
    will recur. Default to MEDIUM and require approval unless clearly a one-off.
kind: ConfigMap
